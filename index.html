<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>オフライン動画圧縮ツール</title>
    <script src="https://unpkg.com/coi-serviceworker@0.1.7/dist/coi-serviceworker.min.js"></script>
    <style>
        :root { --primary: #007AFF; }
        body { font-family: -apple-system, sans-serif; background: #f5f5f7; padding: 20px; display: flex; justify-content: center; }
        .card { background: white; padding: 24px; border-radius: 18px; box-shadow: 0 8px 30px rgba(0,0,0,0.05); width: 100%; max-width: 400px; }
        h1 { font-size: 20px; margin-bottom: 20px; text-align: center; color: #333; }
        .box { border: 2px dashed #007AFF; padding: 30px; border-radius: 12px; text-align: center; cursor: pointer; margin-bottom: 20px; background: #f0f7ff; }
        input[type="number"] { width: 80px; padding: 8px; border-radius: 8px; border: 1px solid #ddd; font-size: 16px; }
        button { background: var(--primary); color: white; border: none; width: 100%; padding: 15px; border-radius: 10px; font-weight: bold; cursor: pointer; margin-top: 10px; font-size: 16px; }
        button:disabled { background: #ccc; }
        #progress { margin-top: 20px; font-size: 14px; color: #666; }
        .bar-bg { width: 100%; height: 10px; background: #eee; border-radius: 5px; margin-top: 8px; overflow: hidden; }
        .bar-fill { height: 100%; background: var(--primary); width: 0%; transition: 0.3s; }
        #result { margin-top: 20px; text-align: center; }
        .download-link { display: inline-block; background: #28a745; color: white; padding: 12px 20px; border-radius: 8px; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

<div class="card">
    <h1>🎬 容量指定コンプレッサー</h1>
    
    <div class="box" onclick="document.getElementById('fileInput').click()">
        <span id="fileName">動画を選択 または ドロップ</span>
        <input type="file" id="fileInput" hidden accept="video/*">
    </div>

    <div style="margin-bottom: 20px;">
        目標サイズ: <input type="number" id="targetSize" value="10"> MB
    </div>

    <button id="runBtn">圧縮を開始する</button>

    <div id="progress" style="display:none;">
        <span id="statusText">準備中...</span>
        <div class="bar-bg"><div id="progressBar" class="bar-fill"></div></div>
    </div>
    
    <div id="result"></div>
</div>

<script type="module">
import { FFmpeg } from 'https://unpkg.com/@ffmpeg/ffmpeg@0.12.10/dist/esm/index.js';
import { toBlobURL } from 'https://unpkg.com/@ffmpeg/util@0.12.1/dist/esm/index.js';

const ffmpeg = new FFmpeg();
const runBtn = document.getElementById('runBtn');
const fileInput = document.getElementById('fileInput');

fileInput.onchange = (e) => {
    if(e.target.files[0]) document.getElementById('fileName').innerText = e.target.files[0].name;
};

runBtn.onclick = async () => {
    const file = fileInput.files[0];
    const targetMB = parseFloat(document.getElementById('targetSize').value);
    if (!file) return alert("動画を選んでください");

    runBtn.disabled = true;
    document.getElementById('progress').style.display = 'block';
    document.getElementById('result').innerHTML = '';
    
    if (!ffmpeg.loaded) {
        document.getElementById('statusText').innerText = "ライブラリ読込中(初回のみ)...";
        const baseURL = 'https://unpkg.com/@ffmpeg/core@0.12.6/dist/esm';
        await ffmpeg.load({
            coreURL: await toBlobURL(`${baseURL}/ffmpeg-core.js`, 'text/javascript'),
            wasmURL: await toBlobURL(`${baseURL}/ffmpeg-core.wasm`, 'application/wasm'),
        });
    }

    await ffmpeg.writeFile('input.mp4', await file.arrayBuffer());

    ffmpeg.on('progress', ({ progress }) => {
        const p = Math.round(progress * 100);
        document.getElementById('progressBar').style.width = p + '%';
        document.getElementById('statusText').innerText = `圧縮中: ${p}%`;
    });

    const targetBytes = Math.floor(targetMB * 1024 * 1024);
    // 2-passに近い挙動でサイズ制限をかける
    await ffmpeg.exec(['-i', 'input.mp4', '-vcodec', 'libx264', '-crf', '28', '-fs', `${targetBytes}`, 'output.mp4']);

    const data = await ffmpeg.readFile('output.mp4');
    const url = URL.createObjectURL(new Blob([data.buffer], { type: 'video/mp4' }));
    
    document.getElementById('result').innerHTML = `
        <p>✅ 完了しました</p>
        <a href="${url}" download="compressed_${file.name}" class="download-link">💾 保存する</a>
    `;
    runBtn.disabled = false;
    document.getElementById('statusText').innerText = "完了！";
};
</script>

</body>
</html>
